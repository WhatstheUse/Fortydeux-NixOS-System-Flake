
# Miracle-WM Configuration

# Action key
action_key: meta

# Input device configuration - consistent with your other WM setups
input:
  touchpad:
    natural_scroll: true
    accel_speed: 0.3
    click_method: clickfinger
    tap_enabled: true
    dwt_enabled: true  # disable while typing
    middle_emulation: true
  
  mouse:
    natural_scroll: true
    # accel_speed: 0.4

  pointer:
    natural_scroll: true
    # accel_speed: 0.4
  
  keyboard:
    numlock_on_startup: true
    repeat_rate: 50
    repeat_delay: 300

# Cursor
#
# `theme` must be set explicitly. Without it miracle loads Mir's built-in
# default theme, while GTK/Qt/Electron clients draw their own pointers from
# XCURSOR_THEME (Stylix sets phinger-cursors-light) - so the pointer changed
# *shape* every time it crossed into a client surface. Naming the same theme
# here makes both sides agree. The theme is resolved via XCURSOR_PATH, which
# uwsm already exports into the session.
#
# `scale` multiplies a base cursor that Mir hard-codes at 24x24 - upstream
# documents this as a known Mir limitation (wiki/docs/configuration/cursor.md:
# "The cursor size is currently fixed at 24x24 regardless of the `scale`
# setting"). So this yields a 48px compositor pointer, and it is an upscale of
# a 24px bitmap rather than a true HiDPI cursor. Clients ignore this value and
# use XCURSOR_SIZE=32 instead, so some residual *size* variation between the
# compositor pointer and client pointers is expected until Mir gains real
# cursor-size support. Lower this to ~1.33 to match clients that draw at 32
# physical px; raise it toward 2.67 to match scale-aware clients that draw at
# 64.
cursor:
  # scale: 2.0
  focus_mode: hover
  theme: phinger-cursors-light

# Window borders
#
# NOTE: `size` and `radius` are in PHYSICAL pixels and are NOT multiplied by the
# output scale. In src/renderer.cpp:draw_border the window rectangle is
# converted to physical pixels (`clip_area * x_scale`) before being handed to
# the shader, but `borderWidth`/`borderRadius` are passed through raw from this
# file. On eDP-1 at scale 2.0 that made `size: 2` render two physical pixels -
# half the apparent thickness of everything else on screen. Doubling it to 4
# restores the intended weight.
#
# TRADEOFF: this is a single global value, so DisplayPort-1 (scale 1.0 in
# display.yaml) now gets a border that looks twice as thick. There is no
# per-output border setting in 0.10.1; pick the value for whichever output you
# use most.
border:
  size: 2
  color: 0x505050ff
  focus_color: 0x7fc8ffff

# Drag and Drop
drag_and_drop:
  enabled: true
  modifiers:
    - primary
    - shift

# Move
move_modifier:
  - primary

# Default action overrides
#
# NOTE: each override is ONE list item; only the first field takes the "- ".
# Prefixing every field with "- " (as an earlier version of this file did)
# creates a separate list entry per key and silently breaks the block.
# Keys are XKB keysym names (see the custom_actions note below).
#
# `name` must be one of miracle's built-in action names (see
# default_key_command_strings in the miracle-wm headers), e.g. toggle_stacking,
# toggle_tabbing, toggle_floating, quit_active_window, quit_compositor,
# reload_config. Note it is "quit_active_window", NOT "close_window".
#
# SHIFTED BINDINGS: miracle compares against the keysym Mir reports, which is
# the shifted one - Shift+s arrives as "S", not "s". This list is a plain
# vector of independent entries, so binding both cases for the same action is
# allowed and makes the binding fire regardless of how the keysym resolves.
default_action_overrides:
  # Toggle stacking on Super+Shift+S
  - name: toggle_stacking
    action: "down"
    modifiers:
      - primary
      - shift
    key: S

  - name: toggle_stacking
    action: "down"
    modifiers:
      - primary
      - shift
    key: s

#   # Override default quit_compositor with working pkill method
  # - name: quit_compositor
    # action: "down"
    # modifiers:
      # - primary
      # - shift
    # key: e
#
#   # Override quit_active_window from Super+Shift+Q to Super+Q
  - name: quit_active_window
    action: "down"
    modifiers:
      - primary
    key: q

# Core custom actions for consistent experience across WMs
#
# KEY NAMES: miracle-wm >= 0.10 parses `key:` with xkb_keysym_from_name(), so
# these must be XKB keysym names, NOT Linux evdev KEY_* codes. Names are
# case-sensitive; use the canonical spelling (lowercase letters, "space",
# "Print", "XF86AudioMute", ...). A bad name is a per-binding parse error that
# makes miracle-wm report "unable to load the full configuration" and drop that
# binding, while still loading the rest of the file.
# Reference: https://xkbcommon.org/doc/current/xkbcommon-keysyms_8h.html
custom_actions:
  # Built-in exit method (buggy - for testing only)
  # - command: miracle-wm --quit-compositor
  #   action: down
  #   modifiers:
  #     - primary
  #     - shift
  #   key: q

  # Launcher keybindings - consistent across your configs.
  # Super+Space opens the shell's own launcher (DMS spotlight here, Noctalia's
  # `msg panel-toggle launcher` elsewhere); Alt+Space stays on anyrun, matching
  # Hyprland/River/Scroll/MangoWC.
  - command: anyrun
    action: down
    modifiers:
      - alt
    key: space

  # DMS spotlight. `dms ipc call spotlight toggle` is upstream's documented
  # launcher binding (docs/IPC.md); it talks to the running shell over its IPC
  # socket, so it is a no-op if DMS is not running rather than starting a copy.
  - command: dms ipc call spotlight toggle
    action: down
    modifiers:
      - primary
    key: space

  # Fuzzel is still installed as a fallback but no longer bound, since Super+Space
  # now belongs to DMS. Uncomment to reach it on Super+D (free in miracle - the
  # defaults use Enter, /, ', R, F, W and S).
  # - command: fuzzel
  #   action: down
  #   modifiers:
  #     - primary
  #   key: d

  # Terminal
  - command: kitty
    action: down
    modifiers:
      - primary
    key: s

  # Volume controls - consistent across your configs
  - command: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
    action: down
    modifiers: []
    key: XF86AudioRaiseVolume

  - command: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    action: down
    modifiers: []
    key: XF86AudioLowerVolume

  - command: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    action: down
    modifiers: []
    key: XF86AudioMute

  # Brightness controls
  - command: brightnessctl set 5%+
    action: down
    modifiers: []
    key: XF86MonBrightnessUp

  - command: brightnessctl set 5%-
    action: down
    modifiers: []
    key: XF86MonBrightnessDown

  # Exit the session cleanly via UWSM (parity with Sway/River/Wayfire)
  # Bound for both keysym cases - see the SHIFTED BINDINGS note above.
  - command: uwsm stop
    action: down
    modifiers:
      - primary
      - shift
    key: E

  - command: uwsm stop
    action: down
    modifiers:
      - primary
      - shift
    key: e

  # Screenshot (full screen) -> Satty editor
  - command: "sh -c 'mkdir -p $HOME/Pictures/Screenshots && grim -t ppm - | satty -f - --output-filename $HOME/Pictures/Screenshots/satty-$(date +%Y%m%d-%H%M%S).png'"
    action: down
    modifiers: []
    key: Print

  # Toggle Waybar. Waybar is no longer autostarted (DMS is the shell now) but is
  # still installed with its config under waybar/, so this is the fallback if DMS
  # misbehaves under Mir. Super only, so no shifted-keysym ambiguity.
  - command: "sh -c 'pkill waybar || waybar -c $HOME/.config/miracle-wm/waybar/config -s $HOME/.config/miracle-wm/waybar/style.css'"
    action: down
    modifiers:
      - primary
    key: b


# Startup applications - using Waybar like your other configs
startup_apps:
  # Hand the session off to UWSM: import WAYLAND_DISPLAY into the systemd/D-Bus
  # activation environment and activate graphical-session.target so the user
  # services (mako, polkit-agent, etc.) start. Must run first.
  - command: uwsm finalize
    restart_on_death: false
  # Wallpaper (mirrors swaybg usage in the other compositors)
  - command: "sh -c 'swaybg -m fill -i $HOME/.config/wallpapers/aurora.jpg'"
    restart_on_death: true
  # Dank Material Shell (DMS) - replaces Waybar as the bar/shell for MiracleWM.
  # `dms run` is upstream's own autostart form for compositors (it is what the DMS
  # Niri deployer writes as spawn-at-startup). The `--session` variant is only for
  # the Type=dbus systemd unit, which we deliberately don't use - see dms.nix.
  # DMS wraps its own Qt/QML import paths, so unlike Noctalia it needs no kirigami
  # QML2_IMPORT_PATH workaround.
  - command: dms run
    restart_on_death: true
  - command: nm-applet --indicator
    restart_on_death: false
  - command: blueman-applet
    restart_on_death: false
  - command: wlsunset -l 40.6 -L -75.4 -t 2300 -T 6500
    restart_on_death: false
  - command: pcloud
    restart_on_death: false
