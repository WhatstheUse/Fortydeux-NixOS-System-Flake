
# Miracle-WM Configuration

# Action key
action_key: meta

# Input device configuration - consistent with your other WM setups
input:
  touchpad:
    natural_scroll: true
    accel_speed: 0.3
    click_method: clickfinger
    tap_enabled: true
    dwt_enabled: true  # disable while typing
    middle_emulation: true
  
  mouse:
    natural_scroll: true
    # accel_speed: 0.4

  pointer:
    natural_scroll: true
    # accel_speed: 0.4
  
  keyboard:
    numlock_on_startup: true
    repeat_rate: 50
    repeat_delay: 300

# Cursor
cursor:
  scale: 2.0
  focus_mode: hover

# Window borders
border:
  size: 2
  color: 0x505050ff
  focus_color: 0x7fc8ffff

# Drag and Drop
drag_and_drop:
  enabled: true
  modifiers:
    - primary
    - shift

# Move
move_modifier:
  - primary

# Default action overrides
#
# NOTE: each override is ONE list item; only the first field takes the "- ".
# Prefixing every field with "- " (as an earlier version of this file did)
# creates a separate list entry per key and silently breaks the block.
# Keys are XKB keysym names (see the custom_actions note below).
#
# `name` must be one of miracle's built-in action names (see
# default_key_command_strings in the miracle-wm headers), e.g. toggle_stacking,
# toggle_tabbing, toggle_floating, quit_active_window, quit_compositor,
# reload_config. Note it is "quit_active_window", NOT "close_window".
#
# SHIFTED BINDINGS: miracle compares against the keysym Mir reports, which is
# the shifted one - Shift+s arrives as "S", not "s". This list is a plain
# vector of independent entries, so binding both cases for the same action is
# allowed and makes the binding fire regardless of how the keysym resolves.
default_action_overrides:
  # Toggle stacking on Super+Shift+S
  - name: toggle_stacking
    action: "down"
    modifiers:
      - primary
      - shift
    key: S

  - name: toggle_stacking
    action: "down"
    modifiers:
      - primary
      - shift
    key: s

#   # Override default quit_compositor with working pkill method
  # - name: quit_compositor
    # action: "down"
    # modifiers:
      # - primary
      # - shift
    # key: e
#
#   # Override quit_active_window from Super+Shift+Q to Super+Q
  - name: quit_active_window
    action: "down"
    modifiers:
      - primary
    key: q

# Core custom actions for consistent experience across WMs
#
# KEY NAMES: miracle-wm >= 0.10 parses `key:` with xkb_keysym_from_name(), so
# these must be XKB keysym names, NOT Linux evdev KEY_* codes. Names are
# case-sensitive; use the canonical spelling (lowercase letters, "space",
# "Print", "XF86AudioMute", ...). A bad name is a per-binding parse error that
# makes miracle-wm report "unable to load the full configuration" and drop that
# binding, while still loading the rest of the file.
# Reference: https://xkbcommon.org/doc/current/xkbcommon-keysyms_8h.html
custom_actions:
  # Built-in exit method (buggy - for testing only)
  # - command: miracle-wm --quit-compositor
  #   action: down
  #   modifiers:
  #     - primary
  #     - shift
  #   key: q

  # Launcher keybindings - consistent across your configs
  - command: anyrun
    action: down
    modifiers:
      - alt
    key: space

  - command: fuzzel
    action: down
    modifiers:
      - primary
    key: space

  # Terminal
  - command: kitty
    action: down
    modifiers:
      - primary
    key: s

  # Volume controls - consistent across your configs
  - command: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
    action: down
    modifiers: []
    key: XF86AudioRaiseVolume

  - command: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    action: down
    modifiers: []
    key: XF86AudioLowerVolume

  - command: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    action: down
    modifiers: []
    key: XF86AudioMute

  # Brightness controls
  - command: brightnessctl set 5%+
    action: down
    modifiers: []
    key: XF86MonBrightnessUp

  - command: brightnessctl set 5%-
    action: down
    modifiers: []
    key: XF86MonBrightnessDown

  # Exit the session cleanly via UWSM (parity with Sway/River/Wayfire)
  # Bound for both keysym cases - see the SHIFTED BINDINGS note above.
  - command: uwsm stop
    action: down
    modifiers:
      - primary
      - shift
    key: E

  - command: uwsm stop
    action: down
    modifiers:
      - primary
      - shift
    key: e

  # Screenshot (full screen) -> Satty editor
  - command: "sh -c 'mkdir -p $HOME/Pictures/Screenshots && grim -t ppm - | satty -f - --output-filename $HOME/Pictures/Screenshots/satty-$(date +%Y%m%d-%H%M%S).png'"
    action: down
    modifiers: []
    key: Print

  # Toggle Waybar
  # - command: sh -c 'pkill waybar || waybar'
  #   action: down
  #   modifiers:
  #     - primary
  #   key: b


# Startup applications - using Waybar like your other configs
startup_apps:
  # Hand the session off to UWSM: import WAYLAND_DISPLAY into the systemd/D-Bus
  # activation environment and activate graphical-session.target so the user
  # services (mako, polkit-agent, etc.) start. Must run first.
  - command: uwsm finalize
    restart_on_death: false
  # Wallpaper (mirrors swaybg usage in the other compositors)
  - command: "sh -c 'swaybg -m fill -i $HOME/.config/wallpapers/aurora.jpg'"
    restart_on_death: true
  # Waybar, pointed at the MiracleWM-specific config/style
  - command: "sh -c 'waybar -c $HOME/.config/miracle-wm/waybar/config -s $HOME/.config/miracle-wm/waybar/style.css'"
    restart_on_death: false
  - command: nm-applet --indicator
    restart_on_death: false
  - command: blueman-applet
    restart_on_death: false
  - command: wlsunset -l 40.6 -L -75.4 -t 2300 -T 6500
    restart_on_death: false
  - command: pcloud
    restart_on_death: false
